<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prévenez-moi · Bona Nodi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Formulaire « prévenez-moi » à intégrer dans Wix (élément HTML / iframe).
   ?produit=Petit%20poisson  → alerte pour une création précise ; sans paramètre → prochain drop. */
:root{--prune:#3C114B;--prune-doux:#6b4a78;--creme:#FFF7C6;--creme-clair:#fffbe3;--ligne:#e5d6b8}
*{box-sizing:border-box}
body{margin:0;background:transparent;color:var(--prune);font:16px/1.5 Figtree,system-ui,sans-serif}
.carte{max-width:520px;margin:0 auto;padding:22px 20px;border-radius:22px;background:var(--creme);border:1.5px solid var(--prune)}
h1{font:600 24px Fredoka,Georgia,serif;margin:0 0 4px}
p.s{margin:0 0 14px;color:var(--prune-doux);font-size:15px}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}
input[type=text],input[type=email]{width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--ligne);background:var(--creme-clair);font:inherit;color:var(--prune)}
input:focus{outline:none;border-color:var(--prune);box-shadow:0 0 0 3px #3c114b22}
.choix{display:flex;gap:8px;flex-wrap:wrap}
.choix label{margin:0;font-weight:500;display:flex;gap:6px;align-items:center;padding:8px 12px;border-radius:999px;border:1.5px solid var(--ligne);background:var(--creme-clair);cursor:pointer}
.choix input{accent-color:var(--prune)}
.rgpd{display:flex;gap:8px;align-items:flex-start;font-weight:400;font-size:13px;color:var(--prune-doux)}
.rgpd input{margin-top:3px;accent-color:var(--prune)}
.rgpd a{color:var(--prune)}
button{margin-top:14px;width:100%;padding:13px;border-radius:999px;border:0;background:var(--prune);color:var(--creme);font:600 16px Fredoka,Georgia,serif;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.msg{margin-top:10px;font-size:14px}
.err{color:#a3241f}
.pot{position:absolute;left:-5000px}
.merci{text-align:center}
.merci .e{font:600 40px Fredoka,serif}
</style>
</head>
<body>
<div class="carte" id="carte">
  <h1 id="titre">Préviens-moi ✦</h1>
  <p class="s" id="sous">Reçois un petit e-mail le jour où les nouvelles pièces arrivent.</p>
  <form id="f" novalidate>
    <div class="choix" id="choix">
      <label><input type="radio" name="sujet" value="drop" checked> Le prochain drop</label>
      <label id="lbProduit" hidden><input type="radio" name="sujet" value="produit"> <span id="nomProduit"></span> de retour</label>
    </div>
    <label for="prenom">Prénom <span style="font-weight:400">(facultatif)</span></label>
    <input id="prenom" type="text" autocomplete="given-name" maxlength="60">
    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="email" maxlength="200" required>
    <input class="pot" id="site" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
    <label class="rgpd"><input id="ok" type="checkbox"> <span>J'accepte que Bona Nodi m'écrive à ce sujet uniquement. Je peux me désinscrire à tout moment. <a href="../confidentialite.html" target="_blank">Confidentialité</a></span></label>
    <button id="bt" type="submit">Me prévenir</button>
    <div class="msg" id="msg" role="status"></div>
  </form>
</div>
<script type="module">
import { SUPABASE_URL, SUPABASE_ANON_KEY } from './perles-config.js';
const $ = s => document.querySelector(s);
const produit = (new URLSearchParams(location.search).get('produit') || '').trim().slice(0, 80);
if (produit) {
  $('#lbProduit').hidden = false; $('#nomProduit').textContent = produit;
  $('#lbProduit input').checked = true;
  $('#sous').textContent = `Cette pièce est épuisée : reçois un e-mail dès qu'elle revient (ou au prochain drop).`;
}
$('#f').addEventListener('submit', async e => {
  e.preventDefault();
  const email = $('#email').value.trim().toLowerCase(), msg = $('#msg');
  msg.className = 'msg err';
  if ($('#site').value) return;                                   // robot
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { msg.textContent = 'Vérifie ton adresse e-mail.'; return; }
  if (!$('#ok').checked) { msg.textContent = 'Coche la case pour accepter de recevoir l\'e-mail.'; return; }
  const sujet = document.querySelector('[name=sujet]:checked').value;
  $('#bt').disabled = true; msg.className = 'msg'; msg.textContent = 'Envoi…';
  try {
    const r = await fetch(SUPABASE_URL + '/rest/v1/alertes_clientes', { method: 'POST',
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
      body: JSON.stringify({ email, prenom: $('#prenom').value.trim() || null, sujet, produit: sujet === 'produit' ? produit : null, consentement: true, page: document.referrer.slice(0, 200) || null }) });
    if (!r.ok) throw new Error(r.status);
    $('#carte').innerHTML = `<div class="merci"><div class="e">✦</div><h1>C'est noté${$('#prenom').value.trim() ? ', ' + $('#prenom').value.trim().replace(/[<>&]/g, '') : ''} !</h1><p class="s">Tu recevras un e-mail ${sujet === 'produit' ? 'dès que « ' + produit.replace(/[<>&]/g, '') + ' » revient' : 'le jour du prochain drop'}.</p></div>`;
  } catch (err) {
    $('#bt').disabled = false; msg.className = 'msg err'; msg.textContent = 'Oups, ça n\'a pas marché. Réessaie dans un instant.';
  }
});
</script>
</body>
</html>
